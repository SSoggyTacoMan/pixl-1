html/head_include="<style>html,body{height:100%;height:100dvh;overscroll-behavior:none}#pixl-fs-btn{position:fixed;top:10px;right:10px;z-index:99999;width:40px;height:40px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.45);color:#fff;font-size:18px;line-height:1;cursor:pointer}</style>\n<script>\n(function(){\n  if (!('ontouchstart' in window || navigator.maxTouchPoints > 0)) return;\n\n  function enterFs(){\n    var el = document.documentElement;\n    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;\n    var p = req ? req.call(el) : null;\n    function lockLandscape(){\n      try { screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(function(){}); } catch (e) {}\n    }\n    if (p && p.then) { p.then(lockLandscape, function(){}); } else { lockLandscape(); }\n  }\n  function exitFs(){\n    var ex = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;\n    if (ex) { try { ex.call(document); } catch (e) {} }\n  }\n  function isFs(){\n    return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);\n  }\n\n  var autoDone = false;\n  function autoGoFs(){\n    if (autoDone) return;\n    autoDone = true;\n    enterFs();\n  }\n  document.addEventListener('touchstart', autoGoFs, { once: true, passive: true });\n  document.addEventListener('touchend', autoGoFs, { once: true, passive: true });\n  document.addEventListener('click', autoGoFs, { once: true });\n\n  // Written into the document stream during the initial parse (before\n  // Godot's own bootstrap script even runs), not appended at runtime — a\n  // runtime appendChild here raced with the engine's own DOM/resize\n  // observation during boot and tripped a scene-tree reentrancy warning.\n  document.write('<button id=\"pixl-fs-btn\" type=\"button\" aria-label=\"Toggle fullscreen\">⛶<\\/button>');\n  var btn = document.getElementById('pixl-fs-btn');\n  btn.addEventListener('click', function(e){\n    e.stopPropagation();\n    if (isFs()) { exitFs(); } else { enterFs(); }\n  });\n  function sync(){ btn.textContent = isFs() ? '✕' : '⛶'; }\n  ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange'].forEach(function(ev){\n    document.addEventListener(ev, sync);\n  });\n})();\n</script>\n<script>\n(function(){\n  // touch-action:none and the viewport user-scalable=no meta tag are both\n  // unreliable on iOS Safari (WebKit ignores them), so pinch-zoom can still\n  // slip through and leave the canvas visibly blurred/pixelated once zoomed\n  // past 1:1 — block multi-touch pinch gestures directly instead.\n  document.addEventListener('touchmove', function(e){ if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });\n  document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, { passive: false });\n  document.addEventListener('gesturechange', function(e){ e.preventDefault(); }, { passive: false });\n})();\n</script>"
